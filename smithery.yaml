# Smithery.ai MCP Server Configuration
# https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      rapidapiKey:
        type: string
        description: "Your RapidAPI Key for TikTok Data, TikTok Shop & No Watermark Video (Get a FREE key at https://rapidapi.com/Techssss/api/tiktok-data-tiktok-shop-no-watermark-video). Leave blank to use the 3 free offline tools."
        default: ""
  commandFunction:
    |-
    (config) => ({
      command: 'node',
      args: ['index.js'],
      env: {
        RAPIDAPI_KEY: config.rapidapiKey || ''
      }
    })
