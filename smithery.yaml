# Smithery.ai MCP Server Configuration
# https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      apifyToken:
        type: string
        description: "Your Apify API Token (Get a free token at https://console.apify.com/account/integrations to run https://apify.com/jistudio/tiktok-shop-scraper). Leave blank to use the 3 free offline tools."
        default: ""
  commandFunction:
    |-
    (config) => ({
      command: 'node',
      args: ['index.js'],
      env: {
        APIFY_TOKEN: config.apifyToken || ''
      }
    })
